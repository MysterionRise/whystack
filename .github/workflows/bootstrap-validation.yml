name: Bootstrap validation

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: bootstrap-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          python-version: "3.12.13"
          enable-cache: true

      - name: Install pinned Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.18.0"

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.17.0

      - name: Validate packet, contracts, traceability, and secret hygiene
        run: ./scripts/verify-bootstrap.sh

      - name: Install locked workspace
        run: make install

      - name: Run blocking static quality checks
        run: make check

      - name: Verify canonical contracts and generated artifacts
        run: make contracts-check
