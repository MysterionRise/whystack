      - reranking
      - citations
      - evaluation
  - id: SRC-LEARN-004
    title: Agents and Orchestration summary
    source_repository_path: summaries/agents-and-orchestration.md
    standalone_resolution: informational-only
    use: concepts-only
    copied_content: false
    derived_principles:
      - explicit-workflow
      - typed-boundaries
