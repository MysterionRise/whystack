schema_version: 1
baseline_id: IB-001
created_on: "2026-07-27"
policy:
  public_distribution: original-or-verified-license-only
  course_material_handling: concept-synthesis-only
  private_material: prohibited
  credentials: prohibited
  runtime_downloads: verify-and-pin-before-release

packet_artifacts:
  - id: SRC-PACKET-001
    paths:
      - "README.md"
      - "BOOTSTRAP_PROMPT.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "SECURITY.md"
      - "THIRD_PARTY_NOTICES.md"
      - ".gitignore"
      - ".env.example"
    origin: project-authored-repository-and-governance-files
    license: MIT
    redistribution: allowed
  - id: SRC-PACKET-002
    paths:
      - ".ai-sdlc/"
      - "_bmad-output/"
      - ".specify/memory/constitution.md"
      - ".specify/templates/overrides/"
      - ".specify/workflows/ai-feature-delivery/"
      - ".specify/workflows/workflow-registry.json"
      - "specs/"
      - "docs/"
    origin: project-authored-lifecycle-baseline-and-delivery-artifacts
    license: MIT
    redistribution: allowed
    notes:
      - workflow-registry-is-spec-kit-managed-metadata-with-project-registration
      - bmad-output-documents-are-project-authored-from-vendored-framework-workflows
  - id: SRC-PACKET-003
    paths:
      - ".github/workflows/bootstrap-validation.yml"
      - "scripts/"
      - "tests/"
    origin: project-authored-bootstrap-verification-and-ci
    license: MIT
    redistribution: allowed
  - id: SRC-PACKET-004
    paths:
      - "seed/sample-project/"
    origin: original-fictional-corpus-created-for-ai-cto-cockpit
    license: MIT
    redistribution: allowed
    restrictions:
      - contains-no-real-personal-data
      - contains-no-course-lab-assets
      - contains-no-private-repository-content
  - id: SRC-PACKET-005
    paths:
      - "evals/README.md"
      - "evals/dataset.schema.json"
      - "evals/seed-v0.jsonl"
      - "evals/attack-seed-v0.jsonl"
    origin: original-project-evaluation-fixtures
    license: MIT
    redistribution: allowed
  - id: SRC-PACKET-006
    paths:
      - "third_party/licenses/BMAD-METHOD-LICENSE.txt"
      - "third_party/licenses/BMAD-TEA-LICENSE.txt"
      - "third_party/licenses/SPEC-KIT-LICENSE.txt"
    origin: unmodified-upstream-license-texts
    license: respective-upstream-MIT-licenses
    redistribution: allowed
    notes:
      - exact-upstream-attribution-is-recorded-under-framework_references
  - id: SRC-PACKET-007
    paths:
      - "Makefile"
      - ".dockerignore"
      - ".node-version"
      - ".python-version"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "pyrightconfig.json"
      - "apps/"
      - "contracts/"
      - "services/"
      - "infra/"
    origin: project-authored-runtime-tooling-and-application-skeleton
    license: MIT
    redistribution: allowed
    notes:
      - PostgreSQL-is-canonical-and-Qdrant-is-derived
      - feature-001-excludes-retrieval-model-calls-memory-and-live-connectors

learning_inputs:
