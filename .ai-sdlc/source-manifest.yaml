  - id: SRC-LEARN-005
    title: Structured LLM Workflows summary
    source_repository_path: summaries/structured-llm-workflows.md
    standalone_resolution: informational-only
    use: concepts-only
    copied_content: false
    derived_principles:
      - schema-validation
      - deterministic-policy
  - id: SRC-LEARN-006
    title: LLM Serving and Inference summary
    source_repository_path: summaries/llm-serving-and-inference.md
    standalone_resolution: informational-only
    use: concepts-only
    copied_content: false
    derived_principles:
      - latency-budget
