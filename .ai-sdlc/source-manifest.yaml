    use: concepts-only
    copied_content: false
    derived_principles:
      - controlled-components
      - fixed-schema-comparison
      - react-owned-authority
  - id: SRC-LEARN-002
    title: Agentic Memory summary
    source_repository_path: summaries/agentic-memory.md
    standalone_resolution: informational-only
    use: concepts-only
    copied_content: false
    derived_principles:
      - event-history
      - typed-durable-facts
      - confirmation-before-inferred-memory
      - bounded-context
  - id: SRC-LEARN-003
    title: RAG and Vector Search summary
    source_repository_path: summaries/rag-and-vector-search.md
    standalone_resolution: informational-only
    use: concepts-only
    copied_content: false
    derived_principles:
