      - qdrant-derived-index
      - fastapi-service-boundary

framework_references:
  - id: SRC-FRAMEWORK-001
    name: BMAD Method
    version: "6.10.0"
    repository: "https://github.com/bmad-code-org/BMAD-METHOD"
    release: "https://github.com/bmad-code-org/BMAD-METHOD/releases/tag/v6.10.0"
    source_commit: "081e64ee5aab2316b912883f7bee528ee143ce36"
    use: lifecycle-method-and-artifact-conventions
    vendored_engine_code: true
    vendored_paths:
      - "_bmad/core/"
      - "_bmad/bmm/"
      - "_bmad/_config/"
      - ".agents/skills/bmad-*/"
      - ".claude/skills/bmad-*/"
    installer_managed_paths:
      - "_bmad/config.toml"
      - "_bmad/scripts/"
    project_managed_scaffolding:
      - "_bmad/custom/"
    excluded_generated_adapters:
      - bmad-agent-dev
      - bmad-code-review
      - bmad-correct-course
      - bmad-create-story
      - bmad-dev-auto
      - bmad-dev-story
      - bmad-qa-generate-e2e-tests
      - bmad-quick-dev
      - bmad-retrospective
      - bmad-spec
      - bmad-sprint-planning
      - bmad-sprint-status
    exclusion_reason: prevent a second auto-discoverable implementation loop
    license: MIT
    license_file: "third_party/licenses/BMAD-METHOD-LICENSE.txt"
  - id: SRC-FRAMEWORK-002
    name: BMAD Test Architect
    version: "1.19.1"
    repository: "https://github.com/bmad-code-org/bmad-method-test-architecture-enterprise"
    source_commit: "74cf6e6adf5a6f46614788f184f340ea58336157"
    npm_package: "bmad-method-test-architecture-enterprise@1.19.1"
    npm_integrity: "sha512-aZDxGqmoKtVHHj/HwhW/wDrESzxrETLrVA+u6bjQvz+ffpuZIRhNjnylVNdjmevxSVJfpWOboiQM1Cqb9JfmMw=="
    use: risk-based-test-and-quality-gate-conventions
    vendored_engine_code: true
    vendored_paths:
      - "_bmad/tea/"
      - ".agents/skills/bmad-tea/"
      - ".agents/skills/bmad-testarch-*/"
      - ".claude/skills/bmad-tea/"
      - ".claude/skills/bmad-testarch-*/"
    license: MIT
    license_file: "third_party/licenses/BMAD-TEA-LICENSE.txt"
  - id: SRC-FRAMEWORK-003
    name: GitHub Spec Kit
    version: "0.14.2"
    repository: "https://github.com/github/spec-kit"
    release: "https://github.com/github/spec-kit/releases/tag/v0.14.2"
    source_commit: "2930d06f41e3ab491ef7d111cfe7676de5ddeabd"
    use: feature-delivery-method-and-artifact-conventions
    vendored_engine_code: true
    vendored_paths:
      - ".specify/"
      - ".agents/skills/speckit-*/"
      - ".claude/skills/speckit-*/"
    project_owned_overrides:
      - ".specify/memory/constitution.md"
      - ".specify/templates/overrides/"
      - ".specify/workflows/ai-feature-delivery/"
      - ".specify/workflows/workflow-registry.json"
    license: MIT
    license_file: "third_party/licenses/SPEC-KIT-LICENSE.txt"

