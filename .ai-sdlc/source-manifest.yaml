      - version-fingerprints
  - id: SRC-LEARN-007
    title: Fashion Assistant Memory experiment
    source_repository_path: experiments/fashion-assistant-memory/
    standalone_resolution: informational-only
    use: concepts-and-clean-room-behavioral-tests
    copied_content: false
    derived_principles:
      - system-of-record-is-not-system-of-context
      - explicit-versus-inferred-writes
      - hard-constraints-in-code
      - context-priority-and-budgets
  - id: SRC-LEARN-008
    title: Talk to Your Data deployment experiment
    source_repository_path: talk-to-your-data/deploy/
