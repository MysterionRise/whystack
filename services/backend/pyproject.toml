[project]
name = "ai-cto-cockpit-backend"
version = "0.1.0"
description = "AI CTO Cockpit backend service"
requires-python = "==3.12.13"
dependencies = [
  "alembic==1.18.5",
  "fastapi==0.140.1",
  "langgraph==1.2.9",
  "psycopg[binary]==3.3.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "sqlalchemy==2.0.51",
  "uvicorn==0.51.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
]
asyncio_mode = "auto"
pythonpath = [
  "src",
]
testpaths = [
  "tests",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "E",
  "F",
  "I",
  "UP",
]
