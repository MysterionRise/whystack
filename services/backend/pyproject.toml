[build-system]
requires = ["uv_build==0.11.16"]
build-backend = "uv_build"

[project]
name = "ai-cto-cockpit-backend"
version = "0.1.0"
description = "AI CTO Cockpit backend service"
requires-python = "==3.12.13"
dependencies = [
  "alembic==1.18.5",
  "cryptography==49.0.0",
  "fastapi==0.140.1",
  "langgraph==1.2.9",
  "psycopg[binary]==3.3.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "pyyaml==6.0.3",
  "sqlalchemy[asyncio]==2.0.51",
  "uuid6==2025.0.1",
  "uvicorn==0.51.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.0",
]

[tool.uv.build-backend]
module-name = "ai_cto_cockpit"

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
]
asyncio_mode = "auto"
testpaths = [
  "tests",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "E",
  "F",
  "I",
  "UP",
]
